<!--
  SHARED MENU - used by every page.
  Edit this one file to change the menu everywhere.
  The current page is highlighted automatically by js/main.js
-->
<nav>
    <div class="Nav">
        <a href="/">
            <img src="/images/logowhite.png" alt="SoundzGood Whitsundays">
        </a>
    </div>

    <ul>
        <li><a href="/">Home</a></li>

        <!--  Events carries a submenu. It opens on hover on a computer, and
              the little arrow opens it on a touch screen, where there is no
              hover to speak of. Add another <li> inside .subnav to put more
              under it - js/main.js needs no changes.                     -->
        <li class="has-sub">
            <a href="/events">Events</a>

            <button type="button" class="sub-toggle"
                    aria-expanded="false" aria-label="Show more under Events">
                <span aria-hidden="true">&#9662;</span>
            </button>

            <ul class="subnav">
                <li><a href="/vendor-signup">Vendor Application</a></li>
            </ul>
        </li>

        <!--  Hire Us carries a submenu the same way Events does. js/main.js
              loops over every .has-sub, so a second one needs no script
              changes - only the markup below.                          -->
        <li class="has-sub">
            <a href="/services">Hire Us</a>

            <button type="button" class="sub-toggle"
                    aria-expanded="false" aria-label="Show more under Hire Us">
                <span aria-hidden="true">&#9662;</span>
            </button>

            <ul class="subnav">
                <li><a href="/entertainment">SoundzGood Entertainment</a></li>
            </ul>
        </li>
        <li><a href="/contact">Contact</a></li>
        <!--  The class is here so the whole item can be hidden on a phone,
              not just the link inside it. Hiding only the link left an
              empty list item that still wrapped onto a second row and made
              the menu taller than it looked.                           -->
        <li class="nav-ticket-item">
            <a class="nav-ticket"
               href="https://events.humanitix.com/soundzgood-2-0-bowen"
               target="_blank" rel="noopener">Buy Tickets</a>
        </li>
    </ul>
</nav>
