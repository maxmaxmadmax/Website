<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SoundzGood Admin</title>

<!-- Staff tool. Not for search engines, not in any public menu. -->
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="images/logo.png">

<!--  admin.css only. The marketing stylesheet is deliberately NOT loaded
      here: this is a different design language - dark rail, light desk -
      and the two would fight each other. Keeping them apart also means
      nothing done in here can reach the public site, and nothing done
      there can reach this.                                             -->
<link rel="stylesheet" href="admin.css?v=115">
<!--  The DJ list for the Friday Nights panel. Same roster the
        entertainment page shows.                                  -->
  <script src="js/roster.js?v=115" defer></script>
  <script type="module" src="js/admin-app.js?v=115"></script>
</head>

<body>

<!-- ==========================================================================
     SIGN IN
     Shown until an account with the admin claim is signed in. The claim is
     what protects this, not the address - see js/admin-app.js.
     ========================================================================== -->
<div class="ad-gate" id="ad-gate">
  <form class="ad-gate-card" id="ad-login">
    <p class="ad-gate-brand">SoundzGood</p>
    <h1>Admin</h1>
    <p class="ad-gate-sub">Staff only.</p>

    <label for="ad-email">Email</label>
    <input type="email" id="ad-email" autocomplete="email" required>

    <label for="ad-password">Password</label>
    <input type="password" id="ad-password" autocomplete="current-password" required>

    <p class="ad-error" id="ad-login-error" hidden></p>

    <button type="submit" class="ad-btn ad-btn-primary" id="ad-login-submit">Sign In</button>
  </form>
</div>


<!-- ==========================================================================
     THE APP
     ========================================================================== -->
<div class="ad-shell" id="ad-shell" hidden>

  <!-- ---- left rail ------------------------------------------------- -->
  <aside class="ad-rail" id="ad-rail">

    <div class="ad-brand">
      <img src="images/logowhite.png" alt="" class="ad-brand-mark">
      <div>
        <p class="ad-brand-name">SoundzGood</p>
        <p class="ad-brand-sub">Events &middot; Production &middot; Hire</p>
      </div>
    </div>

    <!--  THE RAIL

          Grouped rather than one long list. Vendors is where nearly all
          the work is, so it carries its own set and opens by default;
          everything else is a single item.

          data-soon shows the Coming Soon screen instead of a panel, so
          the menu can say where this is heading without pretending the
          page is built.

          Entertainment is not in Max's drawing of this but it is real and
          in use - the DJ diary lives there - so it stays. It is the one
          item here that came from the old menu rather than the new one.
          -->
    <nav class="ad-nav" aria-label="Admin sections">

      <button type="button" class="ad-nav-item" data-view="dashboard" data-soon>
        <span class="ad-ico" aria-hidden="true">▤</span> Dashboard
      </button>

      <button type="button" class="ad-nav-item" data-view="events">
        <span class="ad-ico" aria-hidden="true">◈</span> Events
      </button>

      <!--  A group. The button opens and closes it; the items inside are
            ordinary nav items, so nothing else has to know about groups. -->
      <div class="ad-nav-group is-open" data-group="vendors">
        <button type="button" class="ad-nav-item ad-nav-head" data-group-toggle
                aria-expanded="true">
          <span class="ad-ico" aria-hidden="true">☰</span> Vendors
          <span class="ad-nav-caret" aria-hidden="true">⌃</span>
        </button>

        <div class="ad-nav-sub">
          <button type="button" class="ad-nav-item" data-view="applications">
            Applications
          </button>
          <button type="button" class="ad-nav-item" data-view="vendors">
            Approved Vendors
          </button>
          <button type="button" class="ad-nav-item" data-view="payments" data-soon>
            Payments
          </button>
          <button type="button" class="ad-nav-item" data-view="vendorEmail">
            Vendor Emails
          </button>
          <button type="button" class="ad-nav-item" data-view="map">
            Sites &amp; Map
          </button>
          <button type="button" class="ad-nav-item" data-view="discounts" data-soon>
            Discount Codes
          </button>
        </div>
      </div>

      <button type="button" class="ad-nav-item" data-view="entertainment">
        <span class="ad-ico" aria-hidden="true">♫</span> Entertainment
      </button>

      <button type="button" class="ad-nav-item" data-view="customers" data-soon>
        <span class="ad-ico" aria-hidden="true">☺</span> Customers
      </button>

      <button type="button" class="ad-nav-item" data-view="messages" data-soon>
        <span class="ad-ico" aria-hidden="true">✉</span> Messages
      </button>

      <button type="button" class="ad-nav-item" data-view="reports" data-soon>
        <span class="ad-ico" aria-hidden="true">◔</span> Reports
      </button>

      <button type="button" class="ad-nav-item" data-view="settings">
        <span class="ad-ico" aria-hidden="true">⚙</span> Settings
      </button>
    </nav>

    <!--  The panel at the foot of Max's drawing. A photograph would mean
          shipping one more image and keeping it in step with the brand;
          the words do the same job and cost nothing.               -->
    <div class="ad-rail-card" aria-hidden="true">
      <p class="ad-rail-card-line">Good Events</p>
      <p class="ad-rail-card-line">Better People</p>
    </div>

    <div class="ad-rail-foot">
      <div class="ad-who">
        <span class="ad-avatar" id="ad-avatar" aria-hidden="true"></span>
        <div>
          <p class="ad-who-name" id="ad-who-name">&nbsp;</p>
          <p class="ad-who-role">Admin</p>
        </div>
      </div>
      <button type="button" class="ad-signout" id="ad-signout">Log out</button>
    </div>
  </aside>

  <!-- ---- main ------------------------------------------------------- -->
  <div class="ad-main">

    <header class="ad-top">
      <button type="button" class="ad-rail-toggle" id="ad-rail-toggle"
              aria-label="Show sections">☰</button>

      <a class="ad-top-link" href="/vendor-signup" target="_blank" rel="noopener">
        View signup page ↗
      </a>
    </header>

    <main class="ad-desk" id="ad-desk">
      <p class="ad-loading" id="ad-boot">Loading…</p>
    </main>
  </div>
</div>

</body>
</html>
