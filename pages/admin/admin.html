<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>SoundzGood Admin</title>

<!-- Staff tool. Not for search engines, not in any public menu. -->
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="images/logo.png">

<!-- admin.css only - the public site stylesheet is kept out on purpose so the two never clash. -->
<link rel="stylesheet" href="css/admin.css?v=755">
<!-- The DJ list for the Friday Nights panel (same roster as the entertainment page). -->
  <script src="js/roster.js?v=755" defer></script>
  <script type="module" src="js/admin-app.js?v=755"></script>
  <!-- AUTO-UPDATE: on open (and when the tab comes back) check for a newer version and reload once. -->
  <script>
  (function () {
    var mine = (document.querySelector('script[src*="admin-app.js?v="]') || {}).src || '';
    var cur = (mine.match(/v=(\d+)/) || [])[1];
    function check() {
      if (!cur) return;
      fetch('admin.html?check=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.text(); })
        .then(function (t) {
          var live = (t.match(/admin-app\.js\?v=(\d+)/) || [])[1];
          if (!live || Number(live) <= Number(cur)) return;
          var key = 'sg-admin-reloaded-' + live;
          try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch (e) {}
          var u = new URL(location.href);
          u.searchParams.set('v', live);
          location.replace(u.toString());
        })
        .catch(function () {});
    }
    check();
    document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  })();
  </script>

</head>

<body>

<!-- ==========================================================================
     SIGN IN
     Shown until an account with the admin claim is signed in. The claim is
     what protects this, not the address - see js/admin-app.js.
     ========================================================================== -->
<div class="ad-gate" id="ad-gate">
  <form class="ad-gate-card" id="ad-login">
    <p class="ad-gate-brand">SoundzGood</p>
    <h1>Admin</h1>
    <p class="ad-gate-sub">Staff only.</p>

    <label for="ad-email">Email</label>
    <input type="email" id="ad-email" autocomplete="email" required>

    <label for="ad-password">Password</label>
    <input type="password" id="ad-password" autocomplete="current-password" required>

    <p class="ad-error" id="ad-login-error" hidden></p>

    <button type="submit" class="ad-btn ad-btn-primary" id="ad-login-submit">Sign In</button>
  </form>
</div>


<!-- ==========================================================================
     THE APP
     ========================================================================== -->
<div class="ad-shell" id="ad-shell" hidden>

  <!-- ---- left rail ------------------------------------------------- -->
  <aside class="ad-rail" id="ad-rail">

    <div class="ad-brand">
      <img src="images/logowhite.png" alt="" class="ad-brand-mark">
      <div>
        <p class="ad-brand-name">SoundzGood</p>
        <p class="ad-brand-sub">Events &middot; Production &middot; Hire</p>
      </div>
    </div>

    <!-- THE RAIL - menu grouped under plain section labels. data-soon items are Coming Soon stubs. -->
    <nav class="ad-nav" aria-label="Admin sections">

      <button type="button" class="ad-nav-item" data-view="dashboard">
        <span class="ad-ico" aria-hidden="true">▤</span> Dashboard
      </button>

      <p class="ad-nav-label">Sales</p>
      <button type="button" class="ad-nav-item" data-view="leads">
        <span class="ad-ico" aria-hidden="true">★</span> Gig Opportunities
      </button>
      <button type="button" class="ad-nav-item" data-view="leadRate">
        <span class="ad-ico" aria-hidden="true">🔥</span> Gig Match
      </button>
      <button type="button" class="ad-nav-item" data-view="quoteDocs">
        <span class="ad-ico" aria-hidden="true">▦</span> Sales Pipeline
      </button>

      <p class="ad-nav-label">Events</p>
      <button type="button" class="ad-nav-item" data-view="events">
        <span class="ad-ico" aria-hidden="true">◈</span> Events
      </button>
      <!-- Applications is off the menu on purpose - Vendors > Unpaid shows the same people. #/applications still opens for old links. -->
      <button type="button" class="ad-nav-item" data-view="vendors">
        <span class="ad-ico" aria-hidden="true">☺</span> Vendors
      </button>
      <button type="button" class="ad-nav-item" data-view="map">
        <span class="ad-ico" aria-hidden="true">▦</span> Sites &amp; Map
      </button>
      <button type="button" class="ad-nav-item" data-view="entertainment">
        <span class="ad-ico" aria-hidden="true">♫</span> Entertainment
      </button>

      <p class="ad-nav-label">Pricing</p>
      <button type="button" class="ad-nav-item" data-view="inventory">
        <span class="ad-ico" aria-hidden="true">▧</span> Inventory
      </button>
      <button type="button" class="ad-nav-item" data-view="resources">
        <span class="ad-ico" aria-hidden="true">▤</span> Crew &amp; Vehicles
      </button>

      <p class="ad-nav-label">Communication</p>
      <button type="button" class="ad-nav-item" data-view="customers">
        <span class="ad-ico" aria-hidden="true">☺</span> Customers
      </button>
      <button type="button" class="ad-nav-item" data-view="vendorEmail">
        <span class="ad-ico" aria-hidden="true">✉</span> Messages
      </button>

      <p class="ad-nav-label">Website</p>
      <button type="button" class="ad-nav-item" data-view="pages" data-soon>
        <span class="ad-ico" aria-hidden="true">▢</span> Pages
      </button>
      <button type="button" class="ad-nav-item" data-view="media" data-soon>
        <span class="ad-ico" aria-hidden="true">▣</span> Media
      </button>

      <p class="ad-nav-label">System</p>
      <button type="button" class="ad-nav-item" data-view="settings">
        <span class="ad-ico" aria-hidden="true">⚙</span> Settings
      </button>
      <!-- The version this page is running (read from the admin-app.js?v= number). -->
      <p class="ad-version" id="ad-version">Version &hellip;</p>
      <script>
        (function () {
          var s = document.querySelector('script[src*="admin-app.js"]');
          var m = s && s.getAttribute('src').match(/v=(\d+)/);
          document.getElementById('ad-version').textContent = 'Version ' + (m ? m[1] : '?');
        }());
      </script>
    </nav>

    <div class="ad-rail-foot">
      <div class="ad-who">
        <span class="ad-avatar" id="ad-avatar" aria-hidden="true"></span>
        <div>
          <p class="ad-who-name" id="ad-who-name">&nbsp;</p>
          <p class="ad-who-role">Admin</p>
        </div>
      </div>
      <button type="button" class="ad-signout" id="ad-signout">Log out</button>
    </div>
  </aside>

  <!-- ---- main ------------------------------------------------------- -->
  <div class="ad-main">

    <header class="ad-top">
      <button type="button" class="ad-rail-toggle" id="ad-rail-toggle"
              aria-label="Show sections">☰</button>
    </header>

    <main class="ad-desk" id="ad-desk">
      <p class="ad-loading" id="ad-boot">Loading…</p>
    </main>
  </div>
</div>

</body>
</html>
