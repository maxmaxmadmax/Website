        <link rel="icon" href="images/logo.png" />

        <!-- Admin styles only (the public site css is kept out so the two never clash).
     core = the look every page shares; the rest = one file per feature, only its own bits. -->
        <link rel="stylesheet" href="css/admin/core.css?v=852" />
        <link rel="stylesheet" href="css/admin/map.css?v=852" />
        <link rel="stylesheet" href="css/admin/entertainment.css?v=852" />
        <link rel="stylesheet" href="css/admin/quotes.css?v=852" />
        <link rel="stylesheet" href="css/admin/inventory.css?v=852" />
        <link rel="stylesheet" href="css/admin/packages.css?v=852" />
        <link rel="stylesheet" href="css/admin/leads.css?v=852" />
        <link rel="stylesheet" href="css/admin/customers.css?v=852" />
        <link rel="stylesheet" href="css/admin/messages.css?v=852" />
        <link rel="stylesheet" href="css/admin/dashboard.css?v=852" />
        <link rel="stylesheet" href="css/admin/events.css?v=852" />

        <!-- The DJ list for the Friday Nights panel (same roster as the entertainment page). -->
        <script src="js/roster.js?v=852" defer></script>
        <!-- The admin code: boot.js (the one module) then one plain script per feature, in this order. -->
        <script type="module" src="js/admin/boot.js?v=852"></script>
        <script src="js/admin/core.js?v=852" defer></script>
        <script src="js/admin/vendors.js?v=852" defer></script>
        <script src="js/admin/map.js?v=852" defer></script>
        <script src="js/admin/events.js?v=852" defer></script>
        <script src="js/admin/settings.js?v=852" defer></script>
        <script src="js/admin/entertainment.js?v=852" defer></script>
        <script src="js/admin/messages.js?v=852" defer></script>
        <script src="js/admin/inventory.js?v=852" defer></script>
        <script src="js/admin/quotes.js?v=852" defer></script>
        <script src="js/admin/packages.js?v=852" defer></script>
        <script src="js/admin/crew.js?v=852" defer></script>
        <script src="js/admin/customers.js?v=852" defer></script>
        <script src="js/admin/leads.js?v=852" defer></script>
        <script src="js/admin/lead-rating.js?v=852" defer></script>
        <!-- AUTO-UPDATE: on open (and when the tab comes back) check for a newer version and reload once. -->
        <script>
            (function () {
                var mine = (document.querySelector('script[src*="admin/core.js?v="]') || {}).src || '';
                var cur = (mine.match(/v=(\d+)/) || [])[1];
                function check() {
                    if (!cur) return;
                    fetch('admin.html?check=' + Date.now(), { cache: 'no-store' })
                        .then(function (r) {
                            return r.text();
                        })
                        .then(function (t) {
                            var live = (t.match(/admin\/core\.js\?v=(\d+)/) || [])[1];
                            if (!live || Number(live) <= Number(cur)) return;
                            var key = 'sg-admin-reloaded-' + live;
                            try {
                                if (sessionStorage.getItem(key)) return;
                                sessionStorage.setItem(key, '1');
                            } catch (e) {}
                            var u = new URL(location.href);
                            u.searchParams.set('v', live);
                            location.replace(u.toString());
                        })
                        .catch(function () {});
                }
                check();
                document.addEventListener('visibilitychange', function () {
                    if (!document.hidden) check();
                });
            })();
        </script>
    </head>

    <body>
        <!-- ==========================================================================
     SIGN IN
     Shown until an account with the admin claim is signed in. The claim is
     what protects this, not the address - see js/admin/.
     ========================================================================== -->
        <div class="ad-gate" id="ad-gate">
            <form class="ad-gate-card" id="ad-login">
                <p class="ad-gate-brand">SoundzGood</p>
                <h1>Admin</h1>
                <p class="ad-gate-sub">Staff only.</p>

                <label for="ad-email">Email</label>
                <input type="email" id="ad-email" autocomplete="email" required />

                <label for="ad-password">Password</label>
                <input type="password" id="ad-password" autocomplete="current-password" required />

                <p class="ad-error" id="ad-login-error" hidden></p>

                <button type="submit" class="ad-btn ad-btn-primary" id="ad-login-submit">Sign In</button>
            </form>
        </div>
