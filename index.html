<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SoundzGood Whitsundays | Events, Audio, Lighting and Staging</title>
    <meta name="description" content="SoundzGood Whitsundays run ticketed live events and supply professional audio, lighting, staging and event production across the Whitsundays and North Queensland.">

    <!-- Facebook / Messenger sharing -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SoundzGood Whitsundays">
    <meta property="og:title" content="SoundzGood Whitsundays | Events, Audio, Lighting and Staging">
    <meta property="og:description" content="Live events, plus professional audio, lighting, staging and event production across the Whitsundays and North Queensland.">
    <meta property="og:url" content="https://www.soundzgood.com.au/">
    <meta property="og:image" content="https://www.soundzgood.com.au/images/og-soundzgood.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="SoundzGood Whitsundays">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="images/logo.png">
    <link rel="stylesheet" href="style.css">
    <script src="js/main.js" defer></script>
</head>

<body class="home">

<div id="navbar"></div>

<!-- HERO ---------------------------------------------------------------- -->
<section class="hero">

    <video autoplay muted loop playsinline class="hero-video" poster="images/bowen.jpeg">
        <source src="videos/hero.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="hero-content">
        <img src="images/logowhite.png" alt="SoundzGood Whitsundays" class="hero-logo">

        <div class="buttons">
            <a href="/events" class="btn">View Events</a>
            <a href="/services" class="btn btn-outline">Hire SoundzGood</a>
            <a href="/contact" class="btn btn-outline">Contact Us</a>
        </div>
    </div>

</section>

<!-- FEATURED EVENT ------------------------------------------------------
     The id is used by js/main.js: on the home page the menu stays hidden
     over the hero and slides in once you reach this section.           -->
<section class="section dark" id="next-event">

    <div class="featured-event">

        <p class="eyebrow">Next Event</p>

        <h2>SoundzGood 2.0</h2>

        <ul class="event-facts">
            <li><strong>Saturday 22 August 2026</strong></li>
            <li><strong>Bowen Sporting Complex</strong></li>
            <li><strong>Doors Open 2:00 PM</strong></li>
            <li><strong>18+ Event</strong></li>
        </ul>

        <div class="buttons">
            <a href="https://events.humanitix.com/soundzgood-2-0-bowen"
               class="btn btn-ticket" target="_blank" rel="noopener">Buy Tickets</a>
            <a href="/events" class="btn btn-outline">Event Details</a>
        </div>

    </div>

</section>

<div id="footer"></div>

</body>
</html>
