<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--  HOW THIS LOOKS IN GOOGLE

          Google builds the result from three things, and we control all
          three: the site name, this title, and this description. What we
          cannot control is the list of sitelinks underneath - those are
          chosen by Google from the site's own structure, and there is no
          markup that asks for them. The old demote tool is long gone.

          What does decide them: a clear menu, a sitemap, and pages whose
          titles say plainly what they are. So each page's title now leads
          with its own label - Event Production, What's On, Book
          Entertainment - because when Google does draw a sitelink, the
          words it prints are taken from that page's title.              -->
    <title>SoundzGood | Events &amp; Production</title>
    <meta name="description" content="Audio, lighting, staging, DJs and live events across the Whitsundays and North Queensland. Event production for festivals, weddings, sporting and community events.">

    <!-- Facebook / Messenger sharing -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SoundzGood Whitsundays">
    <meta property="og:title" content="SoundzGood | Events &amp; Production">
    <meta property="og:description" content="Live events, plus professional audio, lighting, staging and event production across the Whitsundays and North Queensland.">
    <meta property="og:url" content="https://www.soundzgood.com.au/">
    <meta property="og:image" content="https://www.soundzgood.com.au/images/og-soundzgood.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="SoundzGood Whitsundays">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="images/logo.png">
    <link rel="stylesheet" href="style.css?v=45">
    <script src="js/main.js?v=45" defer></script>

    <!--  THE NAME GOOGLE PRINTS ABOVE THE RESULT

          Left to itself Google guesses the site name from the domain and
          the title, and has been showing "soundzgood.com.au". This is the
          documented way to tell it otherwise: a WebSite block on the home
          page with the name we actually use. It is the only part of the
          name-and-sitelinks arrangement that is ours to set.            -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "SoundzGood",
      "alternateName": ["SoundzGood Whitsundays", "SoundzGood Events & Production"],
      "url": "https://www.soundzgood.com.au/"
    }
    </script>

    <!--  WHO THIS BUSINESS IS, IN A FORM GOOGLE READS DIRECTLY

          Everything below is taken from the site itself - the phone number
          and email are the ones in the footer, the ABN is the one on the
          tax invoices. Nothing here is invented, and nothing should be:
          structured data that disagrees with the page is worse than none.

          areaServed is the part that matters for search. It is a statement
          of where the work is taken on, which is why the islands are named
          individually rather than folded into "the Whitsundays" - somebody
          searching for Hamilton Island is not searching for a region.   -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "additionalType": "https://schema.org/ProfessionalService",
      "name": "SoundzGood Whitsundays",
      "alternateName": "SoundzGood",
      "url": "https://www.soundzgood.com.au/",
      "logo": "https://www.soundzgood.com.au/images/logowhite.png",
      "image": "https://www.soundzgood.com.au/images/og-soundzgood.png",
      "description": "Audio visual and event production hire across the Whitsundays and North Queensland - PA systems, lighting, staging, LED screens, DJs and technical crew.",
      "telephone": "+61422393022",
      "email": "info@soundzgood.com.au",
      "identifier": "ABN 49 700 595 348",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Bowen",
        "addressRegion": "QLD",
        "addressCountry": "AU"
      },
      "sameAs": [
        "https://www.facebook.com/profile.php?id=61588497981743"
      ],
      "areaServed": [
        { "@type": "Place", "name": "Whitsunday Islands" },
        { "@type": "Place", "name": "Hamilton Island" },
        { "@type": "Place", "name": "Hayman Island" },
        { "@type": "Place", "name": "Daydream Island" },
        { "@type": "Place", "name": "Airlie Beach" },
        { "@type": "Place", "name": "Bowen" },
        { "@type": "Place", "name": "Proserpine" },
        { "@type": "Place", "name": "Collinsville" },
        { "@type": "Place", "name": "North Queensland" }
      ],
      "knowsAbout": [
        "AV hire",
        "Audio visual hire",
        "PA system hire",
        "Stage lighting hire",
        "LED screen hire",
        "Event production"
      ]
    }
    </script>
</head>

<body class="home">

<div id="navbar"></div>

<!-- HERO ---------------------------------------------------------------- -->
<section class="hero">

    <!--  TWO SIZES OF THE SAME CLIP

          A phone gets the 720p one at 3.7 MB, a desktop the 1080p at
          7.2 MB. The browser picks by the media query and only downloads
          the one it picked.

          The small one is listed FIRST on purpose. A browser that ignores
          media on a video source takes whichever comes first, so the worst
          case is everybody gets 720p - which is fine behind the overlay,
          and far better than everybody getting the big file.

          Both are silent and 30fps. The original was 120fps with an audio
          track on a muted video, which is where most of the 17.7 MB went.

          preload="none" keeps the video out of the way of first paint -
          the poster shows immediately and the clip follows.              -->
    <video autoplay muted loop playsinline preload="none"
           class="hero-video" poster="images/bowen.jpeg">
        <source src="videos/hero-720.mp4" type="video/mp4" media="(max-width: 900px)">
        <source src="videos/hero-1080.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="hero-content">
        <img src="images/logowhite.png" alt="SoundzGood Whitsundays" class="hero-logo">

        <div class="buttons">
            <a href="/events" class="btn">View Events</a>
            <a href="/services" class="btn btn-outline">Hire SoundzGood</a>
            <a href="/contact" class="btn btn-outline">Contact Us</a>
        </div>
    </div>

</section>

     The id is used by js/main.js: on the home page the menu stays hidden
     over the hero and slides in once you reach this section.           -->

        <div class="buttons">
            <!--  No Buy Tickets button yet: the only ticket link we have is
                  the Humanitix page for SoundzGood 2.0, which has been and

            <a href="/events" class="btn btn-ticket">Event Details</a>
            <a href="/vendor-signup" class="btn btn-outline">Vendor Applications</a>
        </div>

    </div>

</section>

<div id="footer"></div>

</body>
</html>
