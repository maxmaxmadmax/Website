<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SoundzGood Admin has moved</title>

<!--  THIS PAGE HAS MOVED TO /admin

      This was the first admin page, built to make the very first admin
      account before there was anywhere else to do it. Everything it did -
      bookings, sites, categories, laying out an event - is in /admin now,
      so it is a signpost rather than a page.

      It is kept rather than deleted because the address is written down in
      a few places and somebody will type it. A dead link would look like
      the backend had gone.

      GitHub Pages cannot send a real 301, so the redirect is done in the
      browser. replace() rather than assign() so Back does not bounce
      straight back here.                                              -->
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="refresh" content="0; url=/admin">
<link rel="canonical" href="https://www.soundzgood.com.au/admin">

<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="admin.css?v=37">

<script>
  location.replace('/admin' + location.hash);
</script>
</head>

<body>
<div class="ad-gate">
  <div class="ad-gate-card">
    <p class="ad-gate-brand">SoundzGood</p>
    <h1>Admin has moved</h1>
    <p class="ad-gate-sub">
      The backend now lives at <strong>/admin</strong>. You should be on your
      way there already.
    </p>
    <a class="ad-btn ad-btn-primary" href="/admin">Go to the admin area</a>
  </div>
</div>
</body>
</html>
